name: "Update flake"

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [full, llm-agents]
        default: full
  schedule:
    - cron: '17 * * * *'
    - cron: '47 */6 * * *'

concurrency:
  group: update-flake

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  FULL_COMMIT_MESSAGE: "chore: update flake.lock and pinned packages"
  LLM_AGENTS_COMMIT_MESSAGE: "chore: update llm-agents"

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      issues: write
    steps:
      # Branch tip, not the trigger SHA: a queued run must see the commit of
      # the run before it. Full history for the gate's git log.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - id: gate
        run: .github/scripts/update-mode.sh
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_MODE: ${{ inputs.mode }}
          LLM_AGENTS_CRON: '47 */6 * * *'
      - if: steps.gate.outputs.mode != 'none'
        uses: ./.github/actions/setup-nix
        with:
          nixbuild_token: ${{ secrets.NIXBUILD_TOKEN }}
          niks3-skip-push: true
      - name: Update all inputs and pinned packages
        if: steps.gate.outputs.mode == 'full'
        shell: bash
        run: |
          { nix flake update && nix run .#update-packages; } 2>&1 |
            tee -a "$RUNNER_TEMP/build.log"
      - name: Update llm-agents
        if: steps.gate.outputs.mode == 'llm-agents'
        shell: bash
        run: nix flake update llm-agents 2>&1 | tee -a "$RUNNER_TEMP/build.log"
      - id: diff
        if: steps.gate.outputs.mode != 'none'
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # Verify only; eagle fills cache.thayyil.net when it switches.
      # --keep-going so one run reports every broken package.
      - id: build
        name: Build NixOS configuration
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: >
          nix build .#nixosConfigurations.eagle.config.system.build.toplevel
          --print-build-logs
          --keep-going
          --builders ""
          --max-jobs 2
          --eval-store auto
          --store ssh-ng://eu.nixbuild.net
          2>&1 | tee -a "$RUNNER_TEMP/build.log"
      - name: Report failure
        if: failure() && contains(fromJSON('["full", "llm-agents"]'), steps.gate.outputs.mode)
        run: >
          .github/scripts/update-issue.sh report
          "${{ steps.gate.outputs.mode }}"
          "$RUNNER_TEMP/build.log"
          "${{ steps.gate.outputs.nixpkgs-rev }}"
      - if: steps.diff.outputs.changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: ${{ steps.gate.outputs.mode == 'full' && env.FULL_COMMIT_MESSAGE || env.LLM_AGENTS_COMMIT_MESSAGE }}
      - name: Close failure issues
        if: steps.diff.outputs.changed == 'true'
        run: .github/scripts/update-issue.sh close "${{ steps.gate.outputs.mode }}"
