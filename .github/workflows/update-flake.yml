name: "Update flake"

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

concurrency:
  group: update-flake

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      updates: ${{ steps.updates.outputs.updates }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: nixbuild/nix-quick-install-action@v35
      - id: updates
        run: echo "updates=$(nix eval --json .#ci.updates --apply builtins.attrNames)" >> "$GITHUB_OUTPUT"

  update:
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      issues: write
    # One at a time, so each update checks out the previous one's commit.
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        update: ${{ fromJSON(needs.plan.outputs.updates) }}
    env:
      UPDATE: ${{ matrix.update }}
      ISSUE_TITLE: "Flake update failed: ${{ matrix.update }}"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: ./.github/actions/setup-nix
        with:
          nixbuild_token: ${{ secrets.NIXBUILD_TOKEN }}
          niks3-skip-push: true
      - id: update
        shell: bash
        run: .github/scripts/update.sh "$UPDATE" 2>&1 | tee -a "$RUNNER_TEMP/build.log"
      # A scheduled run skips a key it already reported.
      - id: seen
        if: steps.update.outputs.changed == 'true' && github.event_name == 'schedule'
        env:
          KEY: ${{ steps.update.outputs.key }}
        run: |
          if .github/scripts/update-issue.sh seen "$KEY"; then
            echo "seen=true" >> "$GITHUB_OUTPUT"
          fi
      # Verify only; eagle fills cache.thayyil.net when it switches.
      # --keep-going so one run reports every broken package.
      - id: build
        name: Build NixOS configuration
        if: steps.update.outputs.changed == 'true' && steps.seen.outputs.seen != 'true'
        shell: bash
        run: >
          nix build .#nixosConfigurations.eagle.config.system.build.toplevel
          --print-build-logs
          --keep-going
          --builders ""
          --max-jobs 2
          --eval-store auto
          --store ssh-ng://eu.nixbuild.net
          2>&1 | tee -a "$RUNNER_TEMP/build.log"
      - if: steps.build.outcome == 'success'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update flake (${{ matrix.update }})"
      - name: Close failure issue
        if: steps.build.outcome == 'success'
        run: .github/scripts/update-issue.sh close
      - name: Report failure
        if: failure()
        env:
          KEY: ${{ steps.update.outputs.key }}
        run: .github/scripts/update-issue.sh report "${KEY:-update at $(git rev-parse HEAD)}" "$RUNNER_TEMP/build.log"
